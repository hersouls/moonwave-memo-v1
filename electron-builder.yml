appId: kr.moonwave.memo
productName: Moonwave Memo
copyright: © Moonwave

directories:
  output: release
  buildResources: build

# Renderer (Vite dist) + compiled main/preload + manifest. package.json `main`
# points at electron/out/main.cjs. devDependencies are auto-excluded by electron-builder.
files:
  - dist/**/*
  - electron/out/**/*
  - package.json

win:
  target:
    - nsis

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false

mac:
  target:
    - dmg
  category: public.app-category.productivity
  # Notarization runs automatically when APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD /
  # APPLE_TEAM_ID are present in the environment (§10). Hardened runtime is required.
  hardenedRuntime: true
  notarize: true

linux:
  target:
    - AppImage
  category: Utility

# Auto-update feed (electron-updater). Publishing a signed release to GitHub Releases
# lets installed apps update themselves; `npm run dist:win -- --publish always` (with a
# GH_TOKEN) uploads the artifacts + latest.yml. See docs/ELECTRON_BUILD.md.
publish:
  provider: github
  owner: hersouls
  repo: moonwave-memo-v1
  # Publish a real (non-draft) release so `releases/latest` resolves it — the in-app
  # download proxy (api/download-desktop.ts) fetches the latest published installer.
  releaseType: release

# Code signing is env-driven (electron-builder reads these automatically):
#   Windows: CSC_LINK (base64 .pfx or path) + CSC_KEY_PASSWORD
#   macOS:   CSC_LINK + CSC_KEY_PASSWORD (Developer ID) + APPLE_ID/APPLE_APP_SPECIFIC_PASSWORD/APPLE_TEAM_ID
# Without them the build is unsigned (dev/testing only). Details in docs/ELECTRON_BUILD.md.
