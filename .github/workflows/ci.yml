name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - name: Lint (Oxlint)
        run: npm run lint

      - name: Dead Code Check (Knip)
        run: npx knip --no-exit-code

      - name: Type Check
        run: npx tsc -b --noEmit

      - name: Unit Tests
        run: npm run test:run

      - name: Build
        run: npm run build

      - name: Lighthouse Audit
        run: |
          npm install -g @lhci/cli
          lhci autorun || true
